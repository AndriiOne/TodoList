{% extends "base.html" %}

{% block content %}
<h2 class="fw-bold mb-4">{% if object %}Update Tag{% else %}Create Tag{% endif %}</h2>
<form method="post" class="card p-4 shadow-sm">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="mt-3">
    <button type="submit" class="btn btn-primary px-4">Submit</button>
    <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
  </div>
</form>
{% endblock %}
